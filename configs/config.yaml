server:
  name: "user-service"  # 服务名称，注册到 Etcd
  port: 8080            # HTTP 监听端口
  mode: "debug"         # 运行模式: debug/release

log:
  level: "info"         # 日志级别
  filename: "app.log"   # 日志文件位置
  max_size: 200         # 每个日志文件最大 200MB
  max_age: 7            # 文件最多保留 7 天
  max_backups: 10       # 最多保留 10 个备份